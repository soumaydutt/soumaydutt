name: Contribution city

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours, UTC
  workflow_dispatch:  # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate contribution city
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 tools/contribution-city/generate.py
      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/contribution-city-purple.svg
          git diff --cached --quiet || (git commit -m "chore: update contribution city" && git push)
